# GitHub Actions CI: formatting, lints and the CPU test suite on every
# platform the engine targets.
#
# GPU tests (`ae_render --test gpu`, `ae-client --test water_visibility`) are
# `#[ignore]`d and need a Vulkan 1.3 device plus the validation layers, which a
# GitHub-hosted runner does not have. `cargo test` skips them by default, so
# this workflow is the CPU half of the suite; a GPU runner would be a separate
# job.
#
# `cargo test --workspace` needs what the renderer is built with: `glslc`
# (shaderc) compiles `crates/ae_render/shaders` in its `build.rs`, and SDL3 is
# linked by `ae_render`/`ae-client`. Each OS installs both below. The SPIR-V
# hash gate (`ae_render --test spirv`) is advisory on a glslc that is not the
# pinned 2026.4, which the distribution packages are not, so it does not fail
# here.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt
          # Leave Cargo's own warning handling alone; the repo has its own
          # clippy gate.
          build-warnings: ""
      - name: Check the workspace and the guest crates
        # `tools/fmt.sh --check` reaches the guest manifests (`games/*`,
        # `render/*`, the test guests) that `cargo fmt --all` cannot, and never
        # touches `vendor/`.
        run: tools/fmt.sh --check

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy
          build-warnings: ""
      - name: Install glslc and the fontconfig headers
        # `cargo clippy --all-targets` runs `ae_render`'s build script (glslc)
        # and builds `yeslogic-fontconfig-sys` through `ae_text`.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslc libfontconfig1-dev pkg-config
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      # Report every platform, not just the first failure.
      fail-fast: false
      matrix:
        include:
          # 26.04 is the first Ubuntu whose universe has `libsdl3-dev`; the 24.04
          # images would need SDL built from a tarball, so both Linux jobs pin
          # the distribution that packages it.
          - name: Linux x64
            runner: ubuntu-26.04
          - name: Linux arm64
            runner: ubuntu-26.04-arm
          - name: Windows x64
            runner: windows-latest
          - name: macOS arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          # Both wasm targets from `rust-toolchain.toml`: the tests build their
          # guests for `wasm32-wasip1-threads` and `render/*` for
          # `wasm32-unknown-unknown`.
          target: wasm32-wasip1-threads,wasm32-unknown-unknown
          build-warnings: ""

      - name: Install Linux dependencies
        # `libsdl3-dev` provides the headers, the library and `sdl3.pc`, which
        # is what `sdl3-sys` looks for. The distribution's 3.4 is within the
        # range the bindings cover (`sdl3-sys` supports 3.1.3 and later).
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            glslc libfontconfig1-dev libsdl3-dev pkg-config

      - name: Install Homebrew dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install sdl3 shaderc
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # glslc ships with the Vulkan SDK; the Chocolatey package runs the
          # official LunarG installer without a UI.
          choco install vulkan-sdk --yes --no-progress
          $glslc = @(
            "C:\VulkanSDK",
            "$env:ProgramFiles\VulkanSDK"
          ) | Where-Object { Test-Path $_ } |
            ForEach-Object { Get-ChildItem $_ -Recurse -Filter glslc.exe -ErrorAction SilentlyContinue } |
            Select-Object -First 1
          if (-not $glslc) {
            throw "glslc.exe was not installed with the Vulkan SDK"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $glslc.DirectoryName -Encoding ascii

          # The official MSVC package of SDL3 (headers, import library and
          # DLL). With no pkg-config or vcpkg port to find, sdl3-sys falls
          # back to linking `SDL3`; `LIB` gives the linker the import library
          # and `PATH` gives the test binaries the DLL.
          $zip = Join-Path $env:RUNNER_TEMP "SDL3-devel-VC.zip"
          Invoke-WebRequest -Uri `
            "https://github.com/libsdl-org/SDL/releases/download/release-3.4.20/SDL3-devel-3.4.20-VC.zip" `
            -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          $sdl = Join-Path $env:RUNNER_TEMP "SDL3-3.4.20"
          Add-Content -Path $env:GITHUB_PATH -Value "$($sdl)\lib\x64" -Encoding ascii
          Add-Content -Path $env:GITHUB_ENV -Value "LIB=$($sdl)\lib\x64;$env:LIB" -Encoding ascii
          Add-Content -Path $env:GITHUB_ENV -Value "INCLUDE=$($sdl)\include;$env:INCLUDE" -Encoding ascii

      - name: Build the in-repo render modules
        # `render/<name>` are not workspace members; tests build them on demand
        # through `ae_render::module::build`. Building them here reports a
        # module that no longer compiles as a step of its own, before the
        # 10 minute test run.
        shell: bash
        run: |
          for manifest in render/*/Cargo.toml; do
            cargo build --locked --release --target wasm32-unknown-unknown \
              --manifest-path "$manifest" --target-dir target/render-modules
          done

      - name: Test
        # The `#[ignore]`d GPU tests are skipped; everything else in the
        # workspace runs. Tests build their wasm guests through
        # `ae_sim::build::game`, so the guest crates are compiled here too.
        run: cargo test --locked --workspace
