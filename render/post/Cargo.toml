# Render module with post-processing: the scene into an intermediate image,
# a colour grade into the target, an optional vignette. Built for
# wasm32-unknown-unknown; not part of the main workspace.
[package]
name = "ae_render_post"
version = "0.0.1"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ae-render-sdk = { path = "../../sdk/ae-render-sdk" }

[profile.release]
panic = "abort"
opt-level = "s"

[workspace]
