[package]
name = "ae-sdk"
description = "Rust SDK for AssembleEngine sim modules: typed columns, commands, events, schema."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ae_abi.workspace = true
ae-sdk-macros.workspace = true
# `anim`'s aiming helpers (atan2, sqrt without std; the same bits everywhere).
libm = { version = "0.2.16", optional = true }

[features]
# Engine service components (`ae_sdk::nav`). Opt-in: the derive writes a
# schema record for every type it compiles, and a module's components are
# registered (and take entity ids) whether its systems use them or not.
nav = []
# Catalogue spawning (`ae_sdk::catalog`): spawn requests and def ids. Needs nav.
catalog = ["nav"]
# Animation channels (`ae_sdk::anim`, M14), advanced by the engine's `anim`
# service.
anim = ["dep:libm"]
# Unit coroutines (`ae_sdk::script`, M14): async scripts in host-owned
# slots, resumed by a game system.
script = []
# Poison each script poll's heap when it ends, so a block kept across an
# `await` reads as garbage (guest builds are always release, so this is a
# feature, not `debug_assertions`).
script-checks = ["script"]
