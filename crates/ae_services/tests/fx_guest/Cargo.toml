# Test sim module for crates/ae_services/tests/fx.rs, built by the test
# itself for wasm32-wasip1-threads. Not part of the main workspace.
[package]
name = "ae_services_fx_guest"
version = "0.0.1"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ae-sdk = { path = "../../../../sdk/ae-sdk", features = ["nav", "anim", "fx"] }
libm = "0.2.16"

[profile.release]
panic = "abort"
opt-level = 3

[workspace]
