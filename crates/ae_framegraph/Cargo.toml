[package]
name = "ae_framegraph"
description = "Pure bake-then-execute frame graph: declarations, bake, barrier planning. No Vulkan calls."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Types only (formats, layouts, stage/access masks); nothing links libvulkan.
ae_render_abi.workspace = true
ash.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "bake"
harness = false

[lib]
# Benches live in benches/ (criterion); keeps `cargo bench -- <criterion args>` working.
bench = false
