[package]
name = "ae_text"
description = "Backend-independent font selection, text layout, and glyph atlas preparation"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
parley = { version = "0.13", default-features = false, features = ["std"] }
glyphux = { version = "=0.5.0", default-features = false }
skrifa = "0.49"

[features]
default = ["system-fonts"]
system-fonts = ["parley/system"]
complex-scripts = ["parley/complex-scripts"]
