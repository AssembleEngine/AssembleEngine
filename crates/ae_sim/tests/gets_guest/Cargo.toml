# Test sim module for crates/ae_sim/tests/gets.rs, built by the test itself
# for wasm32-wasip1-threads. Not part of the main workspace.
[package]
name = "ae_sim_tests_gets_guest"
version = "0.0.1"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ae-sdk = { path = "../../../../sdk/ae-sdk" }

[profile.release]
panic = "abort"
opt-level = 3

