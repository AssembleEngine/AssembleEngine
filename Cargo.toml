[workspace]
resolver = "3"
members = ["crates/*", "bins/*", "sdk/*", "spikes/parallel_guest"]
# The flecs build crate keeps its own manifest (see vendor/README.md).
exclude = ["vendor", "games/sandbox", "games/alloc", "games/coro", "games/crossing", "spikes/parallel_guest/guest", "spikes/parallel_guest/guest2", "crates/ae_sim/tests/guest", "render/default", "render/post"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ae_framegraph = { path = "crates/ae_framegraph" }
ae_spatial = { path = "crates/ae_spatial" }
ae_sensors = { path = "crates/ae_sensors" }
ae_view = { path = "crates/ae_view" }
ae_replay = { path = "crates/ae_replay" }
ae_net = { path = "crates/ae_net" }
ae_vfs = { path = "crates/ae_vfs" }
ae_catalog = { path = "crates/ae_catalog" }
ae_model = { path = "crates/ae_model" }
ae_gltf = { path = "crates/ae_gltf" }
ae_bot = { path = "crates/ae_bot" }
ae_map = { path = "crates/ae_map" }
ae_render_abi = { path = "crates/ae_render_abi" }
ae_nav = { path = "crates/ae_nav" }
ae_ecs = { path = "crates/ae_ecs" }
ae_wasm = { path = "crates/ae_wasm" }
ae_sim = { path = "crates/ae_sim" }
ae_services = { path = "crates/ae_services" }
ae_profile = { path = "crates/ae_profile" }
ae_bench = { path = "crates/ae_bench" }
ae_abi = { path = "crates/ae_abi" }
ae-sdk = { path = "sdk/ae-sdk" }
ae-sdk-macros = { path = "sdk/ae-sdk-macros" }

anyhow = "1"
ash = "0.38.0"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmtime = "45.0.2"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
criterion = { version = "0.7", default-features = false }
embed-resource = "3"
# force_build_release: flecs is compiled with NDEBUG in every cargo profile.
# A debug flecs creates extra internal entities, which shifts entity ids and
# therefore sim digests between dev and release builds.
flecs_ecs_sys = { path = "vendor/flecs_ecs_sys", default-features = false, features = ["flecs_meta_c", "flecs_alerts", "use_os_alloc", "force_build_release"] }

[profile.release]
opt-level = 3
debug = "line-tables-only"

[profile.bench]
debug = "line-tables-only"

# Lifted numeric code is far too slow to test unoptimised.
[profile.dev]
opt-level = 1
